# Sin rss (verificado): Diario Financiero, El Mostrador, Emol, CNN Chile, VideoCardz, Intel newsroom,
# TSMC y ANID. Entran por consultas de google news con site:. ANID ademas devuelve 403 a nuestro
# user agent hasta en robots.txt, asi que su scraper queda pendiente.

