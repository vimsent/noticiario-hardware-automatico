# Fuentes de la etapa 1. Campos: ver CLAUDE.md. Todas las urls fueron verificadas el 2026-09-20.
#
# filtro_tema: true  -> en el ranking, un articulo de esta fuente solo cuenta como es_chile
#                       si ademas calza con ranking.keywords_tema_chile (evita que un medio
#                       general chileno llene el cupo de Chile con noticias que no son de tecnologia).
