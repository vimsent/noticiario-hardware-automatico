redaccion:
  prompt_path: prompts/redaccion.md
  claude_bin: claude
  # Flags verificados con claude 2.1.274 (claude --help). El prompt entra por stdin.
  #   --tools            limita el set disponible (sin Bash)
  #   --allowedTools     pre-aprueba esas herramientas para que no pidan permiso
  #   --permission-prompts none   lo que igual pediria permiso se niega en vez de colgar
  claude_args:
    - -p
    - --tools
    - "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
    - --allowedTools
    - "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
    - --permission-mode
    - acceptEdits
    - --permission-prompts
    - none
    - --output-format
    - stream-json                # un evento json por linea: el log se escribe en vivo
    - --verbose                  # requerido por stream-json en modo -p
    - --no-session-persistence
    - --strict-mcp-config
  timeout_min: 30
  palabras_min: 1800
  palabras_max: 3000              # fuera de rango es advertencia, no error
  palabras_prohibidas: [revolucionario, "cambia las reglas del juego", "un antes y un despues", "el presente analisis"]
  noticias_secundarias_min: 4     # [NOTICIA 2..] ademas de la principal
  noticias_secundarias_max: 6
  titular_max_palabras: 14
  columnas_candidatas: [hecho, fecha, cobertura, estatus, hilo, clasificacion, puntaje, decision, motivo]
  # true: el barrido de seguridad tambien cubre los temas del bloque Chile (data centers, subtel,
  # leyes 21.719 y 21.663, anid, astronomia, usm). Lo que encuentre va a barrido.json marcado BARRIDO.
  # Es una red de seguridad mientras crece la cobertura de feeds.yaml; apagado = cero busquedas de Chile.
  barrido_chile: false
