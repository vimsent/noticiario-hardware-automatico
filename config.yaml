  stopwords: [a, al, ante, con, contra, de, del, desde, e, el, en, entre, es, hacia, hasta, la, las, lo, los, mas, o, para, por, que, se, segun, sin, sobre, su, sus, tras, u, un, una, unas, unos, y, ya,
              the, a, an, and, or, of, for, to, in, on, at, by, with, from, as, is, are, be, its, it, this, that, into, over, after, before, about, up, out, new, now, here, why, how, what, says, said]
  embeddings: false            # reservado: agrupacion multilingue, no implementado
  max_grupos: 50
  max_grupos_chile: 35
  max_articulos_con_texto: 3
