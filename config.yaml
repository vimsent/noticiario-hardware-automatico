# Configuración del pipeline Noticiario de Hardware

tts:
  # Motor de voz. Cambia esta línea para comparar:
  #   edge   → voz neuronal de Microsoft (es-CL-LorenzoNeural), necesita internet
  #   kokoro → Kokoro-82M local en la GPU (em_alex / em_santa / ef_dora)
  #   piper  → offline, más robótica
  # El caché de audio es por motor: alternar entre dos no vuelve a sintetizar lo ya hecho.
  # Para re-generar solo la voz y el video: python scripts/main.py --skip-visuals
  engine: edge
  fallback_engines: [piper]     # si el principal falla, se prueba cada uno en orden para el resto del guion
  kokoro_model_path: "models/kokoro-v1.0.onnx"
  kokoro_voices_path: "models/voices-v1.0.bin"
  kokoro_voice: em_alex         # español: em_alex, em_santa (hombre), ef_dora (mujer)
  kokoro_speed: 1.0             # 1.0 normal, 1.1 más rápido
  kokoro_lang: es-419           # es-419 = latinoamericano (seseo); es = España
  kokoro_device: auto           # auto | cuda | cpu
  edge_voice: es-CL-LorenzoNeural   # es-CL-CatalinaNeural (mujer), es-MX-JorgeNeural, es-AR-TomasNeural...
  edge_rate: "+5%"              # velocidad: "+0%" normal, "+10%" más rápido, "-10%" más lento
  edge_pitch: "+0Hz"
  piper_model_path: "models/es_ES-davefx-medium.onnx"
  piper_speed: 3.5               # 1.0 = normal, <1 más lento, >1 más rápido
  piper_sentence_silence: 0.25   # pausa (s) entre oraciones
  cache_dir: "cache/audio"       # audio por bloque (hash de texto+voz): no se vuelve a sintetizar lo que no cambió
  elevenlabs_api_key_env: "ELEVENLABS_API_KEY"   # nombre de la variable de entorno
  elevenlabs_voice_id: ""

music:
  folder_path: "assets/music"    # elige un mp3 al azar de esta carpeta en cada corrida
  volume_db: -14                 # nivel de la música cuando NO hay voz (con ducking) o siempre (sin ducking)
  ducking: true                  # comprimir la música automáticamente mientras habla la voz (sidechain)
  duck_threshold: 0.05           # nivel de voz a partir del cual se baja la música (0-1)
  duck_ratio: 8                  # cuánto se baja: 8 = fuerte, 3 = suave
  duck_attack_ms: 20
  duck_release_ms: 400           # cuánto tarda en volver a subir cuando la voz calla
  fade_in_sec: 2
  fade_out_sec: 3
  seed: null                      # fija un número (ej. 42) para repetir siempre la misma elección

visuals:
  images_dir: "assets/images"
  channel_name: "Noticiario de Hardware"   # aparece arriba a la izquierda en cada tarjeta
  episode_label: ""              # texto arriba a la derecha; vacío = fecha de hoy
  placeholder_bg_color: "#111319"
  placeholder_text_color: "#F5F5F5"
  accent_color: "#4F8CFF"        # color de la etiqueta (NOTICIA 1...) y la barra lateral
  ken_burns: false                # efecto de zoom lento sobre las imágenes fijas
  ken_burns_zoom: 1.08
  strict_assets: false           # true = abortar si el guion pide [IMAGEN]/[DIAGRAMA]/[GRÁFICO] y no hay archivo
  mermaid_cmd: "mmdc"            # CLI de Mermaid para [DIAGRAMA] con código mermaid (npm i -g @mermaid-js/mermaid-cli)
  mermaid_theme: "dark"

video:
  resolution: [1280, 720]
  fps: 2
  output_path: "output/video_final.mp4"
  encoder: auto                  # auto | nvenc (GPU NVIDIA) | libx264 (CPU)
  parallel_jobs: 4               # bloques renderizados a la vez (NVENC en GeForce permite ~8 sesiones)

output:
  clean_intermediates: false     # true = borrar bloques.json, audio/, visuals/ y manifests al terminar.
                                 # Déjalo en false para poder iterar con --skip-audio / --only-assemble.

subtitles:
  enabled: false                  # TODO: implementar con Whisper (ver README)

parsing:
  auto_segment_target_words: 130   # solo se usa si el guion NO trae etiquetas [TAG]
  max_block_words: 220             # red de seguridad: un bloque más largo se parte en sub-bloques (mismo visual, otro extracto)
  pause_sec: 0.8                   # silencio que agrega cada [PAUSA] del guion

# ---------------------------------------------------------------------------
# Etapas previas al video: ingesta, ranking y redaccion (ver CLAUDE.md)
# ---------------------------------------------------------------------------

ingesta:
  feeds_path: feeds.yaml
  db_path: data/noticias.db
  user_agent: "noticiario-hardware/0.1 (+https://github.com/vimsent/noticiario-hardware-automatico)"
  timeout_s: 20
  reintentos: 2
  req_por_seg_por_host: 1
  # hosts que necesitan mas espacio entre requests (segundos); reddit devuelve 429 con 1/s
  intervalo_por_host:
    www.reddit.com: 8
  dias_rezagadas: 7
  zona_horaria: America/Santiago
  google_news_url: https://news.google.com/rss/search
  reddit:
    # rss: anonimo, funciona sin credenciales pero no trae puntaje.
    # oauth: app-only (client_credentials), trae puntaje. Requiere crear una app en
    # https://www.reddit.com/prefs/apps y exportar REDDIT_CLIENT_ID y REDDIT_CLIENT_SECRET.
    metodo: rss
    rss_url: "https://www.reddit.com/r/{subreddit}/top/.rss?t={periodo}&limit={limite}"
    oauth_token_url: https://www.reddit.com/api/v1/access_token
    oauth_api_url: "https://oauth.reddit.com/r/{subreddit}/top?t={periodo}&limit={limite}"
    client_id_env: REDDIT_CLIENT_ID
    client_secret_env: REDDIT_CLIENT_SECRET
  hn:
    url: https://hn.algolia.com/api/v1/search
    item_url: "https://news.ycombinator.com/item?id={id}"
  texto_completo:
    max_por_run: 300
    min_chars: 300

apoyo:
  dolar_url: https://mindicador.cl/api
  precios:
    activo: false          # solotodo, fase posterior

ranking:
  leakers_path: data/leakers.md
  salida_dir: runs
  umbral_titulo: 70
  ventana_agrupacion_dias: 4
